name: Production Health Check

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_delay:
        description: "Skip the Railway redeploy wait (for immediate manual testing)"
        type: boolean
        default: false
      run_ai_probe:
        description: "Also run AI probe (triggers real AI calls, costs money)"
        type: boolean
        default: false

jobs:
  health-check:
    name: Smoke Tests + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      deployments: read  # needed to query GitHub Deployments API

    steps:
      - name: Wait for Railway deployment to succeed
        # On push: always wait. On manual dispatch: wait unless skip_delay is true.
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && !inputs.skip_delay)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for Railway to report deployment success via GitHub Deployments API..."
          echo "Commit: $COMMIT_SHA"
          echo ""

          # Poll the GitHub Deployments API for up to 15 minutes (45 × 20s)
          for i in $(seq 1 45); do
            # Fetch all deployments for this repo, newest first
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/deployments?per_page=10")

            # Find a deployment whose sha matches our commit
            DEPLOYMENT_ID=$(echo "$RESPONSE" | \
              python3 -c "
          import sys, json
          sha = '$COMMIT_SHA'
          deps = json.load(sys.stdin)
          for d in deps:
              if d.get('sha','').startswith(sha[:12]) or sha.startswith(d.get('sha','')[:12]):
                  print(d['id'])
                  break
          " 2>/dev/null || echo "")

            if [ -z "$DEPLOYMENT_ID" ]; then
              echo "Attempt $i: no deployment found for commit ${COMMIT_SHA:0:8} yet, waiting 20s..."
              sleep 20
              continue
            fi

            # Check the latest status of that deployment
            STATUS=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/deployments/$DEPLOYMENT_ID/statuses?per_page=1" | \
              python3 -c "
          import sys, json
          statuses = json.load(sys.stdin)
          print(statuses[0]['state'] if statuses else 'pending')
          " 2>/dev/null || echo "pending")

            echo "Attempt $i: deployment $DEPLOYMENT_ID → state=$STATUS"

            if [ "$STATUS" = "success" ]; then
              echo ""
              echo "Railway deployment succeeded. Proceeding with tests."
              exit 0
            fi

            if [ "$STATUS" = "failure" ] || [ "$STATUS" = "error" ]; then
              echo ""
              echo "Railway deployment reported $STATUS. Aborting tests."
              exit 1
            fi

            # pending / in_progress / queued — keep waiting
            sleep 20
          done

          echo ""
          echo "Deployment did not reach 'success' after 15 minutes. Aborting."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: pnpm exec playwright install chromium --with-deps

      - name: Run smoke tests
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: pnpm test:smoke

      - name: Run E2E tests
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: pnpm test:e2e

      - name: Run AI probe (对话框 + 正文生成 + AI助手)
        # Only runs on manual dispatch when run_ai_probe is checked
        if: github.event_name == 'workflow_dispatch' && inputs.run_ai_probe
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: pnpm test:ai-probe

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## Production Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time (UTC)** | $(date -u '+%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**AI probe ran:** ${{ github.event_name == 'workflow_dispatch' && inputs.run_ai_probe }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the **playwright-report** artifact above to view detailed E2E results." >> $GITHUB_STEP_SUMMARY
